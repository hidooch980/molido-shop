services:
  - type: web
    name: molido-accounting-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: DB_TYPE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: molido-accounting-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: molido-accounting-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: molido-accounting-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: molido-accounting-db
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: molido-accounting-db
          property: database

  - type: web
    name: molido-accounting-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: molido-accounting-db
    plan: free
    databaseName: molido_accounting
    user: molido
